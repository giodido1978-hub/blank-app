<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Data Viewer</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #10b981;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        h1 {
            font-size: 1.5rem;
            text-align: center;
            color: var(--accent);
            margin-bottom: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 6px;
        }

        input, select, button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: #0f172a;
            color: var(--text-main);
            font-size: 1rem;
            box-sizing: border-box;
            margin-bottom: 12px;
        }

        button {
            background-color: var(--accent);
            color: #000;
            font-weight: bold;
            border: none;
            cursor: pointer;
            margin-top: 8px;
        }

        .match-card {
            border-left: 4px solid var(--accent);
        }

        .match-title {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 4px;
        }

        .match-info {
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        .loading {
            text-align: center;
            color: var(--text-sub);
            padding: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Football Data Viewer</h1>

    <div class="card">
        <label for="apiKey">Chiave API (Football-Data.org)</label>
        <input type="text" id="apiKey" placeholder="Inserisci il tuo X-Auth-Token">

        <label for="competition">Campionato</label>
        <select id="competition">
            <option value="SA">Serie A (Italia)</option>
            <option value="CL">Champions League</option>
            <option value="EL">Europa League</option>
            <option value="PL">Premier League (Inghilterra)</option>
            <option value="PD">La Liga (Spagna)</option>
        </select>

        <button onclick="fetchMatches()">Mostra Partite</button>
    </div>

    <div id="results"></div>
</div>

<script>
    async function fetchMatches() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const comp = document.getElementById('competition').value;
        const resultsDiv = document.getElementById('results');

        if (!apiKey) {
            alert('Inserisci prima la chiave API di Football-Data.org');
            return;
        }

        resultsDiv.innerHTML = '<div class="loading">Caricamento in corso...</div>';

        try {
            const response = await fetch(`https://api.football-data.org/v4/competitions/${comp}/matches?status=SCHEDULED`, {
                headers: {
                    'X-Auth-Token': apiKey
                }
            });

            if (!response.ok) {
                const errData = await response.json();
                throw new Error(errData.message || 'Errore API Football-Data.org. Verifica il token.');
            }

            const data = await response.json();
            renderMatches(data.matches);
        } catch (error) {
            resultsDiv.innerHTML = `<div class="card" style="border-color: #ef4444; color: #ef4444;">${error.message}</div>`;
        }
    }

    function renderMatches(matches) {
        const resultsDiv = document.getElementById('results');
        resultsDiv.innerHTML = '';

        if (!matches || matches.length === 0) {
            resultsDiv.innerHTML = '<div class="card">Nessuna partita in programma trovata.</div>';
            return;
        }

        matches.slice(0, 10).forEach(match => {
            const card = document.createElement('div');
            card.className = 'card match-card';

            const date = new Date(match.utcDate).toLocaleString('it-IT', {
                day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'
            });

            card.innerHTML = `
                <div class="match-title">${match.homeTeam.name} vs ${match.awayTeam.name}</div>
                <div class="match-info">Data: ${date} | Giornata: ${match.matchday || '-'}</div>
            `;

            resultsDiv.appendChild(card);
        });
    }
</script>

</body>
</html>
