<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partite di Oggi</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #10b981;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        h1 {
            font-size: 1.5rem;
            text-align: center;
            color: var(--accent);
            margin-bottom: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 6px;
        }

        input, button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: #0f172a;
            color: var(--text-main);
            font-size: 1rem;
            box-sizing: border-box;
            margin-bottom: 12px;
        }

        button {
            background-color: var(--accent);
            color: #000;
            font-weight: bold;
            border: none;
            cursor: pointer;
            margin-top: 8px;
        }

        .match-card {
            border-left: 4px solid var(--accent);
            margin-bottom: 10px;
        }

        .comp-title {
            font-size: 0.85rem;
            color: var(--accent);
            font-weight: bold;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .match-title {
            font-weight: bold;
            font-size: 1.05rem;
            margin-bottom: 4px;
        }

        .match-info {
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        .loading {
            text-align: center;
            color: var(--text-sub);
            padding: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Partite di Oggi</h1>

    <div class="card">
        <label for="apiKey">Chiave API (Football-Data.org)</label>
        <input type="text" id="apiKey" placeholder="Inserisci il tuo X-Auth-Token">

        <label for="matchDate">Seleziona Data</label>
        <input type="date" id="matchDate">

        <button onclick="fetchTodayMatches()">Cerca Partite</button>
    </div>

    <div id="results"></div>
</div>

<script>
    document.getElementById('matchDate').valueAsDate = new Date();

    async function fetchTodayMatches() {
        const apiKey = document.getElementById('apiKey').value.trim().replace(/[()]/g, '');
        const selectedDate = document.getElementById('matchDate').value;
        const resultsDiv = document.getElementById('results');

        if (!apiKey) {
            alert('Inserisci prima la chiave API');
            return;
        }

        resultsDiv.innerHTML = '<div class="loading">Ricerca partite in corso...</div>';

        // Lista dei codici competizione principali inclusi nel piano Free
        const competitions = ['SA', 'CL', 'EL', 'PL', 'PD', 'BL1'];
        let allMatches = [];

        try {
            for (const comp of competitions) {
                const targetUrl = `https://api.football-data.org/v4/competitions/${comp}/matches?dateFrom=${selectedDate}&dateTo=${selectedDate}`;
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl + '&X-Auth-Token=' + apiKey)}`;
                
                const response = await fetch(proxyUrl);
                if (response.ok) {
                    const wrapper = await response.json();
                    const data = JSON.parse(wrapper.contents);
                    if (data.matches && data.matches.length > 0) {
                        allMatches = allMatches.concat(data.matches);
                    }
                }
            }

            renderMatches(allMatches, selectedDate);
        } catch (error) {
            resultsDiv.innerHTML = `<div class="card" style="border-color: #ef4444; color: #ef4444;">Errore: ${error.message}</div>`;
        }
    }

    function renderMatches(matches, dateStr) {
        const resultsDiv = document.getElementById('results');
        resultsDiv.innerHTML = '';

        if (!matches || matches.length === 0) {
            resultsDiv.innerHTML = `<div class="card">Nessuna partita trovata per la data ${dateStr} nei campionati principali.</div>`;
            return;
        }

        matches.forEach(match => {
            const card = document.createElement('div');
            card.className = 'card match-card';

            const time = new Date(match.utcDate).toLocaleTimeString('it-IT', {
                hour: '2-digit', minute: '2-digit'
            });

            const compName = match.competition ? match.competition.name : 'Campionato';

            card.innerHTML = `
                <div class="comp-title">${compName}</div>
                <div class="match-title">${match.homeTeam.name} vs ${match.awayTeam.name}</div>
                <div class="match-info">Ore ${time} | Stato: ${match.status}</div>
            `;

            resultsDiv.appendChild(card);
        });
    }
</script>

</body>
</html>
